[workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]
preview = ["pixi-build"]
requires-pixi = ">=0.82"

[dependencies]
protochem = { path = "." }

[package]
name = "protochem"
version = "0.0.1"

[package.build.backend]
name = "pixi-build-python"
version = "*"

[package.build.config]
# Build a single package for all Python versions >= requires-python (Python stable ABI)
abi3 = true
# The Rust compiler is detected from maturin, but listing it here is what makes Pixi
# rebuild the package when *.rs or Cargo.toml files change
compilers = ["rust"]
# Also rebuild when Cargo.lock changes, but not for generated files in target/
extra-input-globs = ["Cargo.lock", "!target/**"]
# Map dependencies in pyproject.toml to Conda packages
ignore-pyproject-manifest = false
ignore-pypi-mapping = false

[package.build.config.pypi-conda-map]
# Add name mappings for packages not on conda-forge

[feature.test.dependencies]
pytest = ">=9.1.1"
pytest-cov = ">=7.1.0"

# Solve to the lowest versions allowed by the dependency specs (see test-lowest below)
[feature.lowest]
solve-strategy = "lowest"

# Data packages that should always be recent, even when testing lowest versions
# (other packages depend on them without lower bounds)
[feature.lowest.constraints]
ca-certificates = ">=2026.10.18"
tzdata = ">=2026c"

[feature.dev.dependencies]
# Rust toolchain
rust = "*"
# Standard library source, which rust-analyzer needs to resolve `std`
rust-src = "*"
# Type stub generation
maturin = ">=1.15"
# Dependency management
uv = "*"
# Formatting, linting, and pre-commit hooks
ruff = "*"
ty = "*"
lefthook = "*"
actionlint = "*"
# Releases
tbump = "*"
# Template updates
copier = "*"
# Notebooks
ipykernel = "*"
# Documentation (see great-docs.yml)
quarto = ">=1.9.38"
# Element data (see scripts/elements_data.py)
mendeleev = ">=1.3"

[feature.dev.pypi-dependencies]
# Releases
keepachangelog = "*"
# Documentation
great-docs = ">=0.17.0"

[feature.dev.activation.env]
# Keep dev-environment Cargo builds separate from Pixi package builds, which use a
# different Rust toolchain and would otherwise keep invalidating each other's cache
CARGO_TARGET_DIR = "$PIXI_PROJECT_ROOT/target/dev"

[environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default"}
dev = { features = ["dev", "test"], solve-group = "default"}
# Test with the lowest versions allowed by the lower bounds on the dependencies
test-lowest = { features = ["test", "lowest"] }

[feature.test.tasks]
test = { cmd = "pytest", default-environment = "test" }

[feature.dev.tasks]
# Manage pyproject.toml with uv
uv = "uv"
add = "uv add"
remove = "uv remove"
# Local dependency management (see scripts/local.sh)
local = "./scripts/local.sh"
# Run the tests with the lowest dependency versions (see test-lowest environment)
test-lowest = "pixi run -e test-lowest test"
# Individual tasks for pre-commit hooks (must be added to lefthook.yaml)
stubs = "maturin generate-stubs --out python && ruff format python/protochem/_core.pyi"  # see src/python.rs
fmt = "cargo fmt && ruff format ."
lint = "cargo clippy --locked --all-targets --all-features -- -D warnings && ruff check . --fix"
types = "ty check"
test-rs = "cargo test --locked"
workflows = "actionlint"  # lint the GitHub Actions workflows
# Run pre-commit hooks (see lefthook.yaml)
pre-commit = "lefthook run pre-commit --all-files"
pre-commit-check = "lefthook run pre-commit --all-files --tag check"  # skips the tests
pre-commit-local = "lefthook run pre-commit-local --all-files"
# Build and preview documentation (see great-docs.yml)
docs-rust = { cmd = "cargo doc --no-deps --locked", env = { RUSTDOCFLAGS = "-D warnings" } }  # Rust API reference
docs-build = { cmd = "great-docs build && cp -r \"$CARGO_TARGET_DIR/doc/.\" great-docs/_site/rust/", depends-on = ["docs-rust"] }
docs-preview = { cmd = "great-docs preview", depends-on = ["docs-build"] }
# The publish tasks skip files that were already uploaded, so a failed release can be rerun
# Build and publish conda package
build-conda = "pixi publish --target-dir dist"
publish-conda = "pixi upload prefix --skip-existing --channel avcopan/automech dist/*.conda"
# Publish PyPI package (wheels are built by the release workflow)
publish-pypi = "uv publish --check-url https://pypi.org/simple/"
publish-test-pypi = "uv publish --publish-url https://test.pypi.org/legacy/ --check-url https://test.pypi.org/simple/"
# Publish crate to crates.io
publish-crates = "cargo publish --locked"
# Initiate release
version = "tbump current-version"
changelog = { cmd = "keepachangelog release {{ version }}", args=["version"] }
release = "tbump"
# Update against template changes (see scripts/copier-update.sh)
copier-update = "./scripts/copier-update.sh"
# Toggle Git hooks on/off
hooks = "./scripts/hooks.sh"
# Regenerate the element table, src/element/data.rs (see scripts/elements_data.py)
elements-data = "python scripts/elements_data.py"
# Setup and initialize this repository (only run once)
init = { cmd = "./scripts/init.sh" }
