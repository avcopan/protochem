github_url = "https://github.com/avcopan/protochem"

[version]
current = "0.0.2"
regex = '''
  (?P<major>\d+)
  \.
  (?P<minor>\d+)
  \.
  (?P<patch>\d+)
  '''

[git]
message_template = "Bump to {new_version}"
tag_template = "v{new_version}"

[[file]]
src = "Cargo.toml"
search = 'version = "{current_version}"'

[[file]]
src = "pixi.toml"
search = 'version = "{current_version}"'

[[before_commit]]
name = "Update changelog"
cmd = "pixi run changelog {new_version}"

[[before_commit]]
name = "Add changelog to commit"
cmd = "git add CHANGELOG.md"

[[before_commit]]
name = "Update Cargo lockfile"
cmd = "cargo update --workspace"

[[before_commit]]
name = "Add Cargo lockfile to commit"
cmd = "git add Cargo.lock"

[[before_commit]]
name = "Update lockfile"
cmd = "pixi lock"

[[before_commit]]
name = "Add lockfile to commit"
cmd = "git add pixi.lock"
