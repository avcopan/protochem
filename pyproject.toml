[project]
name = "protochem"
dynamic = ["version"]  # taken from Cargo.toml by maturin
description = "Rust learning sandbox for implementing cheminformatics algorithms"
readme = "README.md"  # the PyPI page (crates.io shows CRATE.md instead)
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Andreas V. Copan", email = "avcopan@uga.edu"}]
dependencies = []
requires-python = ">= 3.13"

[project.urls]
Repository = "https://github.com/avcopan/protochem"
Documentation = "https://avcopan.github.io/protochem/"

[build-system]
build-backend = "maturin"
requires = ["maturin>=1.9,<2"]

# Maturin configurations
[tool.maturin]
module-name = "protochem._core"  # compile the Rust code as a private submodule
python-source = "python"                # directory containing the Python package
features = ["python"]                   # enable the Python bindings (see Cargo.toml)
editable-profile = "dev"                # fast, unoptimized builds for local development

# Ruff configurations
[tool.ruff]
src = ["python"]
extend-exclude = [".claude"]  # vendored agent skills

[tool.ruff.lint]
exclude = ["python/protochem/_core.pyi"]  # generated by `pixi run stubs`
select = ["ALL"]
ignore = [
    "COM812",   # missing trailing comma (handled by format)
    "TID252",   # relative import
    "D203",     # conflict: incorrect blank line before class (uses D211 instead)
    "D213",     # conflict: multi-line summary second line (uses D212 instead)
    "CPY001",   # copyright notice
]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = ["S101"]
"scripts/**.py" = ["INP001"]  # standalone scripts, not a package

[tool.ruff.lint.pydocstyle]
convention = "google"

# Ty configurations
[tool.ty.environment]
python = ".pixi/envs/test/bin/python"

[tool.ty.src]
include = [
    "python",
    "tests",
]

# Pytest configurations
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=protochem",
    "--cov-report=term-missing",
    "--cov-report=html",
]

# Pytest-cov configurations
[tool.coverage.run]
branch = true
source = ["protochem"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
