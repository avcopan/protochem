# The workspace holds two crates: the Rust library (this package, in src/) and its Python
# bindings (py-protochem/), which are kept separate so that the library does not
# depend on Python
[workspace]
members = ["py-protochem"]

# Settings shared by both crates
[workspace.package]
version = "0.0.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/avcopan/protochem"

[package]
name = "protochem"
version.workspace = true
edition.workspace = true
description = "Rust learning sandbox for implementing cheminformatics algorithms"
license.workspace = true
repository.workspace = true
homepage = "https://avcopan.github.io/protochem/"
keywords = ["chemistry", "graph", "stereochemistry", "cheminformatics"]
categories = ["science::computational-chemistry::cheminformatics"]
readme = "CRATE.md"  # the crates.io page, also the crate docs (see src/lib.rs)
# Files to include when publishing to crates.io (the Python bindings and package are not
# needed there)
include = ["/src", "/Cargo.toml", "/Cargo.lock", "/CRATE.md", "/LICENSE"]

[lints]
workspace = true  # the lints below

# Compiler and Clippy lints for both crates (see the Rust API Guidelines,
# https://rust-lang.github.io/api-guidelines/)
[workspace.lints.rust]
missing_docs = "warn"  # C-CRATE-DOC, C-EXAMPLE
missing_debug_implementations = "warn"  # C-DEBUG
rust_2018_idioms = { level = "warn", priority = -1 }  # explicit `'_` in paths

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo_common_metadata = "warn"  # C-METADATA
min_ident_chars = "warn"  # single letters only from clippy.toml (rust-style.md, "Naming")

# Optimizations for release builds (of both crates)
[profile.release]
lto = true
codegen-units = 1
